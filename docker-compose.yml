# One-command self-host: `docker compose up`
# App on http://localhost:3000, email inbox (Mailpit) on http://localhost:8025
services:
  postgres:
    image: postgres:16-alpine
    # SSD planner costs (index scans for range reports) and room for parallel query workers
    command:
      [
        "postgres",
        "-c",
        "random_page_cost=1.1",
        "-c",
        "effective_io_concurrency=200",
        "-c",
        "max_connections=200",
      ]
    shm_size: 256mb
    environment:
      POSTGRES_USER: openpromoter
      POSTGRES_PASSWORD: openpromoter
      POSTGRES_DB: openpromoter
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # bound to localhost only; remove this mapping if nothing on the host needs the database
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openpromoter"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

  app:
    # pulls the released image; `docker compose up --build` builds from source instead
    image: ghcr.io/openpromoter/openpromoter:${OPENPROMOTER_VERSION:-latest}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://openpromoter:openpromoter@postgres:5432/openpromoter
      APP_URL: ${APP_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-change-me-in-production-please-32chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-in-production-please-32chars}
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      EMAIL_FROM: ${EMAIL_FROM:-OpenPromoter <hello@localhost>}
      SEED_DEMO: ${SEED_DEMO:-true}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HOSTED_MODE: ${HOSTED_MODE:-false}
      # connections per app process; replicas × this must stay under max_connections above
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      # postgres (shared by every replica, default) or memory (single instance only)
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-postgres}
      # header your proxy/CDN sets to the client IP, e.g. cf-connecting-ip; empty = last X-Forwarded-For hop
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-}

volumes:
  pgdata:
