# One-click deploy: https://render.com/deploy?repo=https://github.com/openpromoter/openpromoter
services:
  - type: web
    name: openpromoter
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: openpromoter-db, property: connectionString }
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: SEED_DEMO
        value: "false"
databases:
  - name: openpromoter-db
    plan: basic-256mb
    postgresMajorVersion: "16"
