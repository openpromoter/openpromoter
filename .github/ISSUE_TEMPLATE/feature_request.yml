name: Feature request
description: Suggest something OpenPromoter should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work.
  - type: textarea
    id: today
    attributes:
      label: What you do today
      description: A workaround or another tool you use for this.
