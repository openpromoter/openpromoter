name: Bug report
description: Something in OpenPromoter does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Security issues go to SECURITY.md and never to a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did and what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to ...\n2. Click ...\n3. See ..."
  - type: dropdown
    id: where
    attributes:
      label: Where you run it
      options:
        - OpenPromoter Cloud
        - Self-hosted with docker compose
        - Self-hosted another way
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
